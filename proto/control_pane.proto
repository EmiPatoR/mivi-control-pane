syntax = "proto3";
package mivi.controlpane.v1;

// ─── Shared config types ───────────────────────────────────────────────────

message CaptureConfig {
  uint32 target_fps   = 1;
  string codec        = 2;  // "h264" | "h265"
  uint32 bitrate_kbps = 3;
}

message AiConfig {
  bool   seg_enabled    = 1;
  uint32 seg_target_fps = 2;
  // Registry code of the segmentation model this exam's protocol resolves to.
  // Empty = pipeline default (single-model deployments keep working unchanged).
  string model_code     = 3;
  // Per-protocol capture crop "x,y,w,h". Empty = machine-profile default.
  string seg_roi        = 4;
}

message StorageConfig {
  string bucket = 1;
  string prefix = 2;  // e.g. "exams/exam_123/"
}

// ─── Requests ─────────────────────────────────────────────────────────────

message StartExamRequest {
  string        exam_id              = 1;
  string        patient_id           = 2;
  string        operator_id          = 3;
  CaptureConfig capture              = 4;
  AiConfig      ai                   = 5;
  StorageConfig storage              = 6;
  reserved      7;                         // was expected_accession — removed (OCR reads patient ID, not accession)
  string        expected_patient_id  = 8;  // DICOM PatientID shown on the machine — OCR gate
  // Where this exam's video/mask/pose streams go: the address the operator's
  // registered headset last spoke from, resolved per exam by the backend.
  // Empty = keep the pipeline's --ip launch default, which is what an older
  // backend (and a manual pipeline run) produces.
  string        headset_ip           = 9;
}

message StopExamRequest {
  string exam_id = 1;
}

message StartRecordingRequest {
  string exam_id = 1;
}

message StopRecordingRequest {
  string exam_id = 1;
}

message SetSegmentationRequest {
  string exam_id = 1;
  bool   enabled = 2;
}

message GetStatusRequest {
  string exam_id = 1;
}

message GetSystemHealthRequest {}

message GetSystemHealthResponse {
  // true = Holoscan is reachable and responding to health pings.
  bool   pipeline_ready   = 1;
  // Round-trip time of the last UDP health ping in ms. 0 if never received.
  int64  last_rtt_ms      = 2;
  // Human-readable reason when pipeline_ready = false.
  string error            = 3;
  // Build versions for the control center's components view. Wire-compatible
  // additions; holoscan_version is empty until a Holoscan with GetStatus
  // (MCTR cmd 6) has answered — the feature-detect for old pipelines.
  string control_pane_version = 4;
  string holoscan_version     = 5;
}

// ─── Responses ────────────────────────────────────────────────────────────

message CommandResponse {
  // true = commande ACKée par Holoscan avec accepted=true
  bool   accepted     = 1;
  // UUID pour corrélation logs / events NATS
  string command_id   = 2;
  string error_code   = 3;
  string error_detail = 4;
}

message StatusResponse {
  string exam_id             = 1;
  // "Idle"|"Starting"|"Active"|"Stopping"|"Error"
  string state               = 2;
  bool   recording_active    = 3;
  bool   seg_enabled         = 4;
  // global à l'instance Holoscan en V1
  bool   pipeline_healthy    = 5;
  int64  started_at_ms       = 6;
  int64  updated_at_ms       = 7;
  int64  last_health_rtt_ms  = 8;
  string last_error          = 9;
  // Merged from Holoscan's GetStatus (MCTR cmd 6) when available — all four
  // stay zero-valued against an old Holoscan. recording_error is the flag
  // MinIORecorderOp sets on queue overflow, previously surfaced nowhere.
  bool   machine_verified    = 10;
  bool   recording_error     = 11;
  string model_code          = 12;
  string holoscan_version    = 13;
}

// ─── ListSessions ─────────────────────────────────────────────────────────

message ListSessionsRequest {}

message SessionInfo {
  string exam_id            = 1;
  string state              = 2;
  bool   recording_active   = 3;
  bool   seg_enabled        = 4;
  int64  started_at_ms      = 5;
  int64  updated_at_ms      = 6;
  string last_error         = 7;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

// ─── Service ──────────────────────────────────────────────────────────────

service ControlPane {
  rpc StartExam        (StartExamRequest)        returns (CommandResponse);
  rpc StopExam         (StopExamRequest)         returns (CommandResponse);
  rpc StartRecording   (StartRecordingRequest)   returns (CommandResponse);
  rpc StopRecording    (StopRecordingRequest)    returns (CommandResponse);
  rpc SetSegmentation  (SetSegmentationRequest)  returns (CommandResponse);
  rpc GetStatus        (GetStatusRequest)        returns (StatusResponse);
  rpc GetSystemHealth  (GetSystemHealthRequest)  returns (GetSystemHealthResponse);
  // The in-memory session registry, for the control center's pipeline debug
  // view. Sessions live for the process lifetime — this is diagnostic state,
  // not history (Postgres owns history).
  rpc ListSessions     (ListSessionsRequest)     returns (ListSessionsResponse);
}
